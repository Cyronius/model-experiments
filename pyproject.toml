[project]
name = "titler"
version = "0.1.0"
description = "Tiny (~8M param) prompt-to-title model: data pipeline, distillation, training, export"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.45",
    "tokenizers>=0.20",
    "torch>=2.4",
    "optimum[onnxruntime]>=1.23",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "httpx>=0.27",
    "datasets>=3.0",
    "datasketch>=1.6",
    "rouge-score>=0.1.2",
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    "accelerate>=1.14.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# scripts/export_gguf.py: everything else it needs (torch, transformers, sentencepiece,
# protobuf, safetensors) is already a base dependency above.
gguf = ["gguf>=0.10", "mistral-common"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["specs"]

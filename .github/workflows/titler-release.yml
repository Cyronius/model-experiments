name: titler release binaries

on:
  push:
    tags: ["titler-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, file: titler }
          - { os: windows-latest, name: windows-x86_64, file: titler.exe }
          - { os: macos-latest, name: macos-arm64, file: titler }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: titler/app
      - name: Build the titler command
        working-directory: titler/app
        run: cargo build --release -p titler-cli
      - name: Name the file for this platform
        shell: bash
        run: cp "titler/app/target/release/${{ matrix.file }}" "titler-${{ matrix.name }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: titler-${{ matrix.name }}*

  libraries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: titler/app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the C library
        working-directory: titler/app
        run: cargo build --release -p titler-capi
      - name: Zip the C library with its header
        shell: bash
        working-directory: titler/app
        run: |
          files="capi/include/titler.h"
          for f in target/release/titler_c.dll target/release/titler_c.dll.lib target/release/titler_c.lib target/release/libtitler_c.so target/release/libtitler_c.dylib target/release/libtitler_c.a; do
            [ -f "$f" ] && files="$files $f"
          done
          python -m zipfile -c "../../titler-capi-${{ matrix.name }}.zip" $files
      - name: Build the Python wheel
        shell: bash
        working-directory: titler/app/python
        run: |
          pip install build wheel setuptools
          python build_wheel.py
          cp dist/*.whl ../../..
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            titler-capi-${{ matrix.name }}.zip
            titler-*.whl

  npm-and-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: titler/app
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build the npm package
        working-directory: titler/app
        run: |
          wasm-pack build wasm --target web --release --out-dir ../npm/pkg --out-name titler_wasm
          cp model/titler-v2-q4_k_m.gguf npm/titler.gguf
          cd npm && npm pack
          cp titler-wasm-*.tgz ../../..
          cp ../model/titler-v2-q4_k_m.gguf ../../../titler-v2-q4_k_m.gguf
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            titler-wasm-*.tgz
            titler-v2-q4_k_m.gguf

name: website

on:
  push:
    tags: ["titler-v*"]
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: titler/app
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build the titler WebAssembly module
        working-directory: titler/app
        run: wasm-pack build wasm --target web --release --out-dir "$GITHUB_WORKSPACE/_site/titler/pkg" --out-name titler_wasm
      - name: Assemble the site
        run: |
          cp site/index.html _site/
          cp titler/app/website/index.html titler/app/website/worker.js _site/titler/
          cp titler/app/model/titler-v3-q4_k_m.gguf _site/titler/titler.gguf
          rm -f _site/titler/pkg/.gitignore _site/titler/pkg/package.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

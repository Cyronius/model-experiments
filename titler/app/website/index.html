<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>titler: a 4 MB title model</title>
<meta name="description" content="A 4 MB model that turns a prompt into a short title. It runs in your browser; nothing you type is sent anywhere.">
<link rel="stylesheet" href="./demo.css">
<style>
  :root { color-scheme: light dark; --bg: #fafaf8; --card: #fff; --ink: #1d1d1b; --muted: #666660; --line: #deded7; --accent: #2f5fd0; --fail: #b3412f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1e1e1c; --ink: #ecebe6; --muted: #aaa99f; --line: #3e3e38; --accent: #8aafff; --fail: #ef8a78; }
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--muted) var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  ::selection { background: var(--accent); color: var(--bg); }
  main { max-width: 640px; margin: 0 auto; padding: 36px 24px 64px; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: .22em; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .back { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; }
  h1 { margin: 28px 0 8px; font-size: 36px; line-height: 1.2; font-weight: 650; letter-spacing: -.035em; }
  .lead { margin: 0 0 28px; color: var(--muted); max-width: 60ch; }
  footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; }
</style>
</head>
<body>
<main>
  <a class="back" href="../">Model experiments</a>
  <h1>titler</h1>
  <p class="lead">A tiny model that turns a prompt into a short title. Nothing you type leaves your browser.</p>
    <form class="titler-demo" data-titler data-worker="./worker.js">
      <label for="titler-prompt">Try a prompt</label>
      <textarea id="titler-prompt" rows="4" required aria-describedby="titler-status" placeholder="How do I sort a list of dictionaries by a key in Python?"></textarea>
      <div class="titler-actions">
        <button class="titler-submit" type="submit" disabled>Title it</button>
        <button class="titler-cancel" type="button" data-cancel hidden>Cancel</button>
        <span class="titler-shortcut">Ctrl / Cmd + Enter</span>
      </div>
      <output for="titler-prompt" aria-label="Generated title" aria-live="polite"></output>
      <p class="titler-status" id="titler-status" role="status">Runs locally. The 4 MB model downloads on your first request.</p>
      <noscript><p>Enable JavaScript to try the demo.</p></noscript>
    </form>
  <footer><a href="https://github.com/Cyronius/model-experiments/tree/main/titler">Code and write-up</a> · <a href="https://github.com/Cyronius/model-experiments/blob/main/titler/app/EMBEDDING.md">Use it in your app</a></footer>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
